name: Desktop compatibility tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: python {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Assemble a clean checkout
        run: |
          import os, platform, subprocess, sys
          from pathlib import Path
          print(platform.platform(), platform.machine(), flush=True)
          subprocess.run([sys.executable, 'install.py', '--skills-dir', str(Path(os.environ['RUNNER_TEMP'])/'paperforge-ci-skills')], check=True)
      - name: Check dependencies and require real Chrome
        run: |
          import os, subprocess
          from pathlib import Path
          python = str(Path('.venv')/('Scripts/python.exe' if os.name == 'nt' else 'bin/python'))
          subprocess.run([python, '-m', 'pip', 'check'], check=True)
          subprocess.run([python, '-c', "from browser_config import detect_browsers; b=detect_browsers(); print(b); assert 'chrome' in b, 'Chrome is required: browser tests must not all skip'"], check=True)
      - name: Restore packaged Edge sandbox permissions on Ubuntu runner
        if: runner.os == 'Linux'
        run: |
          import os, stat, subprocess
          from pathlib import Path
          helper = Path('/opt/microsoft/msedge/msedge-sandbox')
          # The hosted image loses the package's setuid bit. Keep sandboxing on;
          # verify the trusted package owns this exact helper before restoring it.
          owner = subprocess.check_output(['dpkg-query', '-S', str(helper)], text=True).strip()
          assert owner == 'microsoft-edge-stable: ' + str(helper), owner
          assert helper.is_file() and not helper.is_symlink()
          print('Packaged Edge sandbox mode:', oct(stat.S_IMODE(helper.stat().st_mode)), flush=True)
          subprocess.run(['sudo', '-n', 'chown', 'root:root', str(helper)], check=True)
          subprocess.run(['sudo', '-n', 'chmod', '4755', str(helper)], check=True)
          assert helper.stat().st_uid == 0 and stat.S_IMODE(helper.stat().st_mode) == 0o4755
      - name: Run regression and synthetic full-stack tests
        run: |
          import os, subprocess
          from pathlib import Path
          python = str(Path('.venv')/('Scripts/python.exe' if os.name == 'nt' else 'bin/python'))
          subprocess.run([python, '-m', 'unittest', 'discover', '-s', 'tests', '-v'], check=True)
      - name: Diagnose native startup failures
        if: failure()
        run: |
          import os, subprocess
          from pathlib import Path
          python = str(Path('.venv')/('Scripts/python.exe' if os.name == 'nt' else 'bin/python'))
          subprocess.run([python, 'tools/diagnose_startup.py'], check=True, timeout=60)
